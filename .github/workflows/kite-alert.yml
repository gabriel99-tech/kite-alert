name: Kite Alert

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [state.json]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kite-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python kite_alert.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # state.json recuerda lo último avisado para no repetir mensajes.
      - name: Guardar estado
        run: |
          if [ -f state.json ]; then
            git config user.name "kite-alert"
            git config user.email "kite-alert@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || git commit -m "Actualiza estado"
            git push
          fi

      # Publica site/index.html como página web.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
